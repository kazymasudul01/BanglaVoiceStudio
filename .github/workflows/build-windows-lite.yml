name: Build Windows Lite EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-lite/**'
      - '.github/workflows/build-windows-lite.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r desktop-lite/requirements.txt pyinstaller==6.16.0
      - name: Package Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BanglaVoiceStudioLite --collect-all transformers --collect-all tokenizers --collect-all safetensors --collect-all torch desktop-lite/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: BanglaVoiceStudioLite-Windows-EXE
          path: dist/BanglaVoiceStudioLite.exe
